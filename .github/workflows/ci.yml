name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Testes unitários e de integração (Vitest + RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run test:coverage
      - name: Resumo da cobertura
        if: always()
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const row = (k) => '| ' + k + ' | ' + t[k].pct + '% |';
            console.log(['## Cobertura de testes', '| Métrica | % |', '|---|---|', ...['statements','branches','functions','lines'].map(row)].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

  e2e:
    name: Testes E2E e acessibilidade (Cypress + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: dist/coverage
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
